spring:
  application:
    name: finance-tracker
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/auth
      - classpath:db/migration/user_profile
      - classpath:db/migration/institution
      - classpath:db/migration/asset
      - classpath:db/migration/account
      - classpath:db/migration/transaction
      - classpath:db/migration/fees
    out-of-order: false
  security:
    user:
      password: ${SECURITY_USER_PASSWORD:disabled}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
  info:
    env:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

info:
  app:
    name: finance-tracker
    version: 0.0.1
    description: Personal finance tracking system

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    expiration-ms: ${AUTH_JWT_EXPIRATION_MS}