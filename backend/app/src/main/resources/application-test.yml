spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/finance_test}
    username: ${TEST_DB_USERNAME:test}
    password: ${TEST_DB_PASSWORD:test}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.finance: WARN