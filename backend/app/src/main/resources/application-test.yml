spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:tc:postgresql:16:///finance_test}
    username: ${TEST_DB_USERNAME:test}
    password: ${TEST_DB_PASSWORD:test}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
  jpa:
    show-sql: false

logging:
  level:
    com.finance: WARN